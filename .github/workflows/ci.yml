name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  appstream:
    name: AppStream metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install appstreamcli
        run: sudo apt-get update && sudo apt-get install -y appstream

      - name: Validate
        run: |
          output=$(appstreamcli validate --no-net data/*.metainfo.xml 2>&1) || true
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -q 'errors:'; then
            exit 1
          fi

  rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install tooling
        run: dnf install -y git make python3 rpm-build tar

      - uses: actions/checkout@v4

      - name: Build
        run: make rpm RPMTOP=/tmp/rpmbuild

      - name: Inspect package
        run: |
          rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE}\n' /tmp/rpmbuild/RPMS/noarch/*.rpm
          rpm -qpl /tmp/rpmbuild/RPMS/noarch/*.rpm | sort
          rpm -qpl /tmp/rpmbuild/RPMS/noarch/*.rpm | grep -q 'metainfo.xml'
