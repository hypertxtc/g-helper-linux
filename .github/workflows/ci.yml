name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and package (RPM)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: >
          dnf install -y curl git make tar rpm-build python3 python3-dbus
          python3-pip python3-gobject gobject-introspection gtk4 libadwaita
          appstream desktop-file-utils dbus-daemon xorg-x11-server-Xvfb

      - uses: actions/checkout@v7

      - name: Install ruff
        run: |
          curl -fsSL -o /tmp/ruff.tgz \
            https://github.com/astral-sh/ruff/releases/latest/download/ruff-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/ruff.tgz -C /tmp
          install -m 755 /tmp/ruff-x86_64-unknown-linux-gnu/ruff /usr/local/bin/ruff
          ruff --version

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      # GTK4 has no headless backend, so give it an X server and the session
      # bus a GApplication wants.  A private system bus keeps Asusd's eager
      # connection from failing while asusd itself is absent.
      - name: Headless UI smoke tests
        env:
          GHELPER_UI_TESTS: "1"
          GSK_RENDERER: cairo
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
          dbus-run-session -- xvfb-run -a \
            env PYTHONPATH=src python3 -m unittest discover -s tests \
              -p 'test_ui_smoke.py' -v

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net data/*.metainfo.xml

      - name: Validate install scripts and the desktop entry
        run: |
          bash -n install.sh
          bash -n setup.sh
          bash -n packaging/build-asusctl-deb.sh
          sh -n data/ghelper-rescan-pci
          sh -n data/ghelper-setup-fix
          desktop-file-validate data/*.desktop

      # The Makefile path is covered by the RPM below; this checks the other
      # supported install route and the console script from pyproject.toml.
      - name: Install through pip and run the entry point
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-deps .
          /tmp/venv/bin/ghelper-linux --version

      - name: Build RPM
        run: make rpm RPMTOP=/tmp/rpmbuild

      - name: Inspect RPM
        run: |
          rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE}\n' /tmp/rpmbuild/RPMS/noarch/*.rpm
          rpm -qpl /tmp/rpmbuild/RPMS/noarch/*.rpm | sort
          rpm -qpl /tmp/rpmbuild/RPMS/noarch/*.rpm | grep -q metainfo.xml

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: /tmp/rpmbuild/RPMS/noarch/*.rpm
          if-no-files-found: error

  deb:
    name: Build Debian package (DEB)
    runs-on: ubuntu-latest
    container: debian:stable
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot dpkg-dev git lintian \
            python3 python3-gi python3-gi-cairo python3-dbus \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 \
            desktop-file-utils appstream

      - uses: actions/checkout@v7

      # debian/rules delegates to "make install", so the DEB and RPM ship the
      # same layout; the unit tests run from override_dh_auto_test.
      - name: Build DEB
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../ghelper-linux_*.deb dist/

      - name: Lint and inspect DEB
        run: |
          lintian --fail-on error dist/*.deb
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb | sort
          dpkg-deb -c dist/*.deb | grep -q metainfo.xml

      - name: Install and run the package
        run: |
          # asusctl and cardwire are required at install time on target systems
          # (via third-party repos), so ignore only those two in the stock Debian
          # container while still enforcing every Debian runtime dependency.
          dpkg --ignore-depends=asusctl,cardwire -i dist/*.deb
          ghelper-linux --version

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  asusctl-deb:
    name: Build asusctl Debian package (Ubuntu 24.04)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libudev-dev libusb-1.0-0-dev \
            libclang-dev dpkg-dev git curl ca-certificates

      - name: Ensure Rust toolchain is up to date
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - name: Build asusctl DEB
        run: bash packaging/build-asusctl-deb.sh --output dist

      - name: Inspect asusctl DEB
        run: |
          dpkg-deb -I dist/asusctl_*.deb
          dpkg-deb -c dist/asusctl_*.deb | sort
          CONTENTS="$(dpkg-deb -c dist/asusctl_*.deb)"
          echo "$CONTENTS" | grep -q '/usr/bin/asusd'
          echo "$CONTENTS" | grep -q '/usr/bin/asusctl'
          echo "$CONTENTS" | grep -q '/usr/lib/systemd/system/asusd.service'
          echo "$CONTENTS" | grep -q '/usr/share/dbus-1/system.d/asusd.conf'

      - name: Upload asusctl DEB
        uses: actions/upload-artifact@v7
        with:
          name: asusctl-deb
          path: dist/asusctl_*.deb
          if-no-files-found: error

  release:
    name: Attach packages to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, deb, asusctl-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "g-helper-linux ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
