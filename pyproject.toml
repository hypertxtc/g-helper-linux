[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghelper-linux"
version = "0.4.1"
description = "A lightweight G-Helper style control centre for ASUS laptops on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PyGObject>=3.42",
    "dbus-python>=1.2",
]

[project.gui-scripts]
ghelper-linux = "ghelper.__main__:main"

[project.urls]
Homepage = "https://github.com/hypertxtc/g-helper-linux"
Issues = "https://github.com/hypertxtc/g-helper-linux/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghelper = ["data/*", "data/icons/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Start with the pyflakes/pycodestyle error set ruff enables by default.
select = ["E4", "E7", "E9", "F"]
